# ---------------------------------------------------------------------------
#  Profile metrics — generates SVG cards and commits them into this repo.
#  Path:  .github/workflows/metrics.yml
#
#  SETUP (one time):
#   1. Create a classic PAT:  github.com/settings/tokens/new
#      Scopes: public_repo, read:org, read:user   ·  Expiration: no expiration
#   2. Add it here as a secret named METRICS_TOKEN:
#      Settings → Secrets and variables → Actions → New repository secret
#   3. Settings → Actions → General → Workflow permissions
#      → select "Read and write permissions"
#   4. Actions tab → "Profile metrics" → Run workflow  (first run is manual)
#
#  After the first successful run, four SVGs land in the repo root and the
#  README picks them up. Nothing is fetched from a third party at page load.
# ---------------------------------------------------------------------------

name: Profile metrics

on:
  schedule:
    - cron: "0 4 * * *"      # daily, 04:00 UTC (06:00 Berlin)
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:

      # ── 1. Overview: repos, commits, followers, lines changed ──────────────
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cypriennkeneng
          filename: metrics.overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Berlin
          repositories_affiliations: owner, collaborator, organization_member
          plugin_lines: yes

      # ── 2. Languages ──────────────────────────────────────────────────────
      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cypriennkeneng
          filename: metrics.languages.svg
          base: ""
          config_timezone: Europe/Berlin
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage, bytes-size
          plugin_languages_sections: most-used

      # ── 3. Contribution calendar + current streak ──────────────────────────
      - name: Isocalendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cypriennkeneng
          filename: metrics.isocalendar.svg
          base: ""
          config_timezone: Europe/Berlin
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ── 4. Achievements (the trophy-case replacement) ──────────────────────
      - name: Achievements
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: cypriennkeneng
          filename: metrics.achievements.svg
          base: ""
          config_timezone: Europe/Berlin
          repositories_affiliations: owner, collaborator, organization_member
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
